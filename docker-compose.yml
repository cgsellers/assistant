# Two ways to run Ledgerline, chosen by profile:
#
#   docker compose --profile dev up -d
#       Postgres and the OCR container only. The API and worker run on the
#       host with `uv run`, so --reload works and breakpoints are usable.
#
#   docker compose --profile app up -d --build
#       Everything in containers, shaped the way a deployment is: the
#       database is migrated first, then the API and worker start from one
#       image, the OCR container sits on a network with no way out, and
#       Caddy serves the whole product on one origin: the portal at
#       http://localhost:8080, the API under /api, the panel under /panel.
#       (8000 and 5173 stay free for the dev servers.)
#
#       A demo client full of documents, at no cost (demo/seed.py):
#       docker compose --profile app run --rm api python -m demo.seed
#
# Postgres has no profile, so it runs in both.

x-ocr: &ocr
  # Built from the repo root so it can take ocr/pdftext.py; the root
  # .dockerignore keeps .env and data/ out of the build context.
  build:
    context: .
    dockerfile: services/ocr_service/Dockerfile
  image: ledgerline-ocr:dev
  environment:
    OCR_DPI: "200"
    OCR_MAX_PAGES: "20"

  # --- Hardening ---
  # This is the process that parses files uploaded by strangers, so it gets
  # the least authority that still lets it work. It holds no credentials, and
  # in the app profile it can reach neither the database nor the internet.
  read_only: true          # nothing may modify the filesystem
  tmpfs:
    - /tmp                 # ...except scratch space, which is in RAM
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

  healthcheck:
    # Reports whether the models are actually loaded, not merely that the
    # process is up -- see the /health handler in app.py.
    test: ["CMD", "python", "-c",
           "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
    interval: 15s
    timeout: 5s
    # Generous: the models take a few seconds to load on a cold start, and
    # failing the healthcheck during startup would restart-loop the container.
    start_period: 60s
    retries: 3
  restart: unless-stopped

x-app-env: &app-env
  # The application role, not the owner: row-level security binds it, and
  # would not bind the owner (core/dbroles.py). Only `migrate` is the owner.
  DATABASE_URL: postgresql+psycopg://ledgerline_app:${APP_DB_PASSWORD:-ledgerline-app-dev}@db:5432/ledgerline
  OCR_SERVICE_URL: http://ocr:8001
  STORAGE_DIR: /data/files
  # From the shell or the project's .env, by name only: compose substitutes
  # this one variable, and nothing else from .env reaches the containers.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Plain http on localhost here; a deployment behind TLS leaves it on.
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  # Where invitation links point: the portal, as Caddy serves it.
  PORTAL_URL: ${PORTAL_URL:-http://localhost:8080}
  # Optional: a daily cap on model spend, in dollars (core/spend.py).
  MAX_DAILY_SPEND_USD: ${MAX_DAILY_SPEND_USD:-}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ledgerline-app:dev
  profiles: [app]
  environment: *app-env
  volumes:
    # The API writes uploads, the worker reads them: one store, shared.
    - files:/data/files
  networks: [backend, ocr]

services:
  db:
    image: postgres:17
    container_name: ledgerline-db
    environment:
      POSTGRES_USER: ledgerline
      # Local development only; a deployment takes its password from a secret.
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      # Loopback only: nothing off this machine reaches the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # For the host workflow: the same container, with its port published so
  # `uv run` can reach it on localhost. Publishing a port needs a network
  # with a way out, so this one is not isolated -- which is why it is the
  # development shape only.
  ocr-dev:
    <<: *ocr
    profiles: [dev]
    container_name: ledgerline-ocr
    ports:
      # Matches ocr_service_url in core/config.py
      - "127.0.0.1:8001:8001"

  # The deployment shape: reachable only from the API and the worker, on a
  # network Docker gives no route out of. A parser exploited by a crafted PDF
  # can reach neither the internet nor the database.
  ocr:
    <<: *ocr
    profiles: [app]
    container_name: ledgerline-ocr-isolated
    networks: [ocr]

  # Runs once per `up`, then exits, as the database owner: migrations, the
  # application role (created or put back, with exactly the rights it needs),
  # then the starter processors (create-only, so it never touches one edited
  # in the panel). The API and worker wait for it to succeed, so neither ever
  # sees an old schema or a role without its grants.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://ledgerline:ledgerline@db:5432/ledgerline
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-ledgerline-app-dev}
    command:
      - sh
      - -c
      - alembic upgrade head && python -m core.dbroles && python -m doctypes.seed && python -m doctypes.listing backfill
    restart: "no"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    container_name: ledgerline-api
    # Not published: everything reaches it through Caddy, on one origin.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness, not liveness: up *and* on the schema this code expects.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # The front door: the portal's built files, and /api and /panel proxied to
  # the API (deploy/Caddyfile). The only container with a published port
  # besides the database's loopback one.
  web:
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: ledgerline-web:dev
    profiles: [app]
    container_name: ledgerline-web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs:
      # Caddy's own scratch space, owned by the user it runs as.
      - /data:uid=1000,gid=1000
      - /config:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    <<: *app
    container_name: ledgerline-worker
    command: ["python", "-m", "worker.run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:

networks:
  backend: {}
  # No route out: Docker gives an internal network no gateway.
  ocr:
    internal: true
