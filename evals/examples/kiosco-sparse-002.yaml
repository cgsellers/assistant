# A short till roll that prints almost nothing. Most fields are legitimately
# absent, so this is the case that catches a model inventing values to fill
# the schema -- which is what `null` in `expect` is for.
doc_type: receipt
# Synthetic: the OCR text and the expected values were written together,
# so these are ground truth by construction rather than by inspection.
verified: true
notes: synthetic; no vendor, no date, no tax breakdown on the roll

ocr_text: |
  TOTAL                     4,20
  EFECTIVO                  5,00
  CAMBIO                    0,80

expect:
  vendor: null
  tax_id: null
  issued_on: null
  subtotal: null
  tax_amount: null
  total: '4,20'
  currency: null
  payment_method: cash
  line_items: []            # the roll itemises nothing
