[project]
name = "ledgerline"
version = "0.1.0"
description = "Document ingestion pipeline for small-business finances"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "anthropic",
    "httpx",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_tesseract: requires the tesseract binary on PATH",
    "needs_ocr_service: requires the ocr container running on :8001",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `def handler(session: Session = Depends(get_session))` is the documented
# FastAPI dependency-injection idiom, not the mutable-default bug B008 targets.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated. The long lines are Alembic's own constraint names;
# rewrapping them by hand would just be undone by the next autogenerate.
# F401: the template imports sa/op unconditionally; an empty revision uses neither.
"alembic/versions/*.py" = ["E501", "F401"]
